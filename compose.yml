name: petrohydropipe

services:
  backend:
    image: petrohydropipe-backend:local
    build:
      context: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      ACCOUNT_SETUP_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    image: petrohydropipe-frontend:local
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000
        VITE_USE_MOCK_LOGIN: "false"
    ports:
      - "5173:80"
    restart: unless-stopped