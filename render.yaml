services:
  - type: web
    name: petrohydropipe-backend
    runtime: node
    plan: starter
    # ponytail: single-instance RAM SSE/rate-limit/IoT-auth caches; move to Redis before scaling >1.
    numInstances: 1
    rootDir: Backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY
        value: "1"

  - type: web
    name: petrohydropipe-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-pR6qyqiNC8ISMA6JPIIWYdqe1ewinuEoCHXA9VdtCao='; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://petrohydropipe-backend.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
