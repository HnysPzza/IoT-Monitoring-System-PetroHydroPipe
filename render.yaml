services:
  - type: web
    name: petrohydropipe-backend
    runtime: node
    plan: starter
    # ponytail: single-instance RAM SSE/rate-limit/IoT-auth caches; move to Redis before scaling >1.
    numInstances: 1
    buildCommand: npm --prefix Backend ci --omit=dev && npm --prefix Frontend ci --include=dev && npm --prefix Frontend run build
    startCommand: npm --prefix Backend start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGIN
        sync: false
      - key: ACCOUNT_SETUP_ORIGIN
        sync: false
      - key: WATCHDOG_MODE
        value: enforce
